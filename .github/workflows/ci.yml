name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run the CLI test suite
        run: npm test

  smoke:
    name: Create a project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Create a project from the template and check it
        run: npm run smoke -- contracts web

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check, test and build
        run: node ../packages/geeknative/bin/geeknative.js check contracts web
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-logs
          path: template/.geeknative/logs/

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK Platform 37
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null
      - name: Build and run unit tests
        run: node ../packages/geeknative/bin/geeknative.js check contracts android
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-logs
          path: template/.geeknative/logs/

  ios:
    name: iOS app
    runs-on: macos-26
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build and run tests on a simulator
        run: node ../packages/geeknative/bin/geeknative.js check contracts ios
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-logs
          path: template/.geeknative/logs/
